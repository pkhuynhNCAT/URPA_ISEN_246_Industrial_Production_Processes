<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#152d49" />
    <meta
      name="description"
      content="A gentle, interactive manufacturing learning game for NCAT ISEN 246 Industrial Production Processes. Explore plastics and casting one small step at a time."
    />
    <title>Maker Academy · NCAT ISEN 246</title>
    <style>
      :root {
        --ink: #172c42;
        --muted: #53677b;
        --navy: #152d49;
        --blue: #176bc2;
        --blue-light: #e8f2fc;
        --gold: #e7ad39;
        --paper: #f5f7fa;
        --line: #dce4ec;
        --white: #fff;
        --green: #186953;
        --green-bg: #e9f6f0;
        --shadow: 0 12px 35px #223b5410;
        --radius: 22px;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        font-size: 17px;
        line-height: 1.6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      a,
      input {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button {
        border: 0;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      a {
        color: #115ca7;
        text-underline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid #b8750b;
        outline-offset: 4px;
      }
      button:focus:not(:focus-visible),
      [tabindex]:focus:not(:focus-visible) {
        outline: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        line-height: 1.16;
        letter-spacing: -0.04em;
      }
      h1 {
        font-size: 38px;
        font-weight: 760;
      }
      h2 {
        font-size: 28px;
      }
      h3 {
        font-size: 21px;
      }
      p + p {
        margin-top: 12px;
      }
      small,
      .note {
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.14em;
        font-weight: 800;
        text-transform: uppercase;
        color: #516b84;
        margin-bottom: 12px;
      }
      .pill {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        font-weight: 750;
        padding: 5px 12px;
        border-radius: 30px;
        background: #eef3f8;
        color: #49627a;
        white-space: nowrap;
      }
      .pill.live {
        background: #eaf6f0;
        color: var(--green);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .skip {
        position: absolute;
        top: -70px;
        left: 16px;
        background: white;
        padding: 12px;
        z-index: 99;
      }
      .skip:focus {
        top: 10px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      .topbar {
        height: 83px;
        padding: 0 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: white;
        border-bottom: 1px solid var(--line);
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        background: none;
        text-align: left;
        color: var(--navy);
        padding: 0;
      }
      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: var(--navy);
        display: grid;
        place-items: center;
        color: #ffd16c;
      }
      .brand-name {
        font-size: 18px;
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .brand-sub {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        display: block;
        margin-top: 4px;
      }
      .nav {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .nav button {
        padding: 10px 15px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        background: transparent;
        color: #52697e;
      }
      .nav button.active {
        background: #eaf2fc;
        color: #155697;
      }
      .nav button:hover {
        background: #f0f4f8;
      }
      .top-progress {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 13px;
        font-weight: 750;
      }
      .tiny-meter {
        height: 5px;
        width: 80px;
        border-radius: 10px;
        overflow: hidden;
        background: #e4eaf0;
      }
      .tiny-meter span {
        display: block;
        height: 100%;
        background: #d99e2f;
        border-radius: 10px;
      }
      .main {
        max-width: 1432px;
        margin: auto;
        padding: 30px 36px 40px;
      }
      .main > div {
        animation: appear 0.25s ease-out;
      }
      .page-top {
        margin: 14px 0 28px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: end;
      }
      .page-top p {
        margin-top: 12px;
        max-width: 680px;
      }
      .primary,
      .secondary,
      .quiet,
      .danger {
        min-height: 48px;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 750;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        line-height: 1.4;
        text-decoration: none;
      }
      .primary {
        background: var(--navy);
        color: white;
        box-shadow: 0 4px 8px #162d4610;
      }
      .primary:hover {
        background: #224968;
        transform: translateY(-1px);
      }
      .primary.gold {
        background: #ffcd62;
        color: #253447;
      }
      .secondary,
      .subtle {
        background: white;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .secondary:hover,
      .subtle:hover {
        background: #f1f6fb;
      }
      .quiet {
        background: transparent;
        color: #486078;
        font-size: 14px;
        padding: 10px 12px;
        min-height: 44px;
      }
      .quiet:hover {
        background: #e9eff5;
      }
      .danger {
        background: #a23737;
        color: white;
      }
      .button-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
      }
      .intro {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        min-height: 485px;
        background: var(--navy);
        border-radius: 27px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .intro-copy {
        padding: 47px 38px 40px;
        color: white;
        position: relative;
      }
      .intro-copy .eyebrow {
        color: #b6cce0;
      }
      .intro h1 {
        font-size: 52px;
        line-height: 1.04;
        letter-spacing: -0.055em;
        max-width: 550px;
      }
      .intro h1 em {
        font-style: normal;
        color: #ffce6d;
      }
      .intro-copy > p {
        color: #d3e1ef;
        font-size: 18px;
        max-width: 470px;
        margin-top: 23px;
      }
      .intro .note {
        color: #bacfe2;
        margin-top: 14px;
      }
      .intro-visual {
        background: #dfe9f1;
        position: relative;
        padding: 16px 10px 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .intro-visual svg {
        width: 100%;
        display: block;
      }
      .intro-visual .floating-tag {
        position: absolute;
        top: 25px;
        left: 25px;
        z-index: 1;
        background: #fffffff2;
        padding: 8px 14px;
        border: 1px solid white;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 750;
        box-shadow: var(--shadow);
        letter-spacing: 0.03em;
      }
      .visual-note {
        position: absolute;
        bottom: 22px;
        left: 28px;
        right: 28px;
        background: white;
        border-radius: 15px;
        box-shadow: var(--shadow);
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 14px;
      }
      .visual-note strong {
        font-size: 16px;
        display: block;
      }
      .intro-outcomes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-top: 24px;
      }
      .outcome {
        display: flex;
        align-items: start;
        gap: 16px;
        border-radius: 17px;
        background: white;
        padding: 24px;
        box-shadow: 0 4px 20px #243a5310;
      }
      .outcome .n {
        font-size: 14px;
        font-weight: 800;
        border-radius: 10px;
        background: #edf3f9;
        padding: 6px 12px;
      }
      .outcome h3 {
        font-size: 17px;
        letter-spacing: -0.02em;
        margin: 2px 0 8px;
      }
      .outcome p {
        font-size: 14px;
        color: var(--muted);
      }
      .course-link {
        display: flex;
        gap: 20px;
        justify-content: space-between;
        padding: 24px 3px;
        font-size: 14px;
        color: var(--muted);
      }
      .course-link p {
        max-width: 750px;
      }
      .work-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        gap: 16px;
      }
      .breadcrumb {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 13px;
        color: var(--muted);
      }
      .breadcrumb button {
        background: none;
        padding: 7px 0;
        color: var(--muted);
        font-weight: 650;
      }
      .lesson-heading {
        margin-bottom: 25px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: center;
      }
      .lesson-heading .eyebrow {
        margin-bottom: 9px;
      }
      .lesson-heading h1 {
        font-size: 36px;
      }
      .lesson-heading p {
        color: var(--muted);
        margin-top: 9px;
        font-size: 16px;
      }
      .steps {
        display: flex;
        gap: 6px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 50px;
        padding: 5px;
        flex-shrink: 0;
      }
      .step {
        padding: 8px 13px;
        border-radius: 40px;
        font-size: 13px;
        color: #6a7b8a;
        white-space: nowrap;
        font-weight: 700;
      }
      .step.active {
        color: #155a9a;
        background: #e9f3fd;
      }
      .step.finished {
        color: var(--green);
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr);
        gap: 24px;
        align-items: start;
      }
      .stage-panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .stage-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 16px 22px;
        border-bottom: 1px solid #e8edf1;
      }
      .stage-bar strong {
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      .stage-wrap {
        background: #e8eff5;
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .stage-wrap svg {
        width: 100%;
        height: auto;
        display: block;
        aspect-ratio: 840/510;
      }
      .stage-wrap svg text {
        font-family: Arial, Helvetica, sans-serif;
      }
      .stage-wrap .scene-number {
        font-size: 25px;
        font-weight: bold;
      }
      .stage-wrap .sim-transition {
        animation: appear 0.55s ease-out;
      }
      .scene-flow {
        stroke-dasharray: 16 12;
        animation: flow 1.5s linear infinite;
      }
      .scene-soft {
        animation: softpulse 2.2s ease-in-out infinite;
      }
      .scene-turn {
        transform-origin: 410px 242px;
        animation: rock 5s ease-in-out infinite;
      }
      .motion-off *,
      .motion-off *:before,
      .motion-off *:after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
      .stage-caption {
        padding: 19px 23px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        background: white;
        min-height: 92px;
      }
      .stage-caption .number-circle {
        background: #e9f1f9;
        color: #135f9f;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        font-size: 13px;
        font-weight: 800;
        margin-top: 2px;
      }
      .stage-caption p {
        font-size: 15px;
        color: #486176;
      }
      .stage-caption strong {
        color: var(--ink);
        display: block;
        font-size: 15px;
      }
      .bench-note {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 12px 7px;
        color: #697a8a;
        font-size: 12px;
      }
      .coach {
        background: white;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 26px 27px;
        box-shadow: var(--shadow);
      }
      .coach-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        gap: 10px;
      }
      .coach-label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 750;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: #eaf1f8;
        color: #234e72;
        font-size: 14px;
        font-weight: 850;
        position: relative;
      }
      .avatar:after {
        content: "";
        position: absolute;
        background: #3fa583;
        width: 7px;
        height: 7px;
        border: 2px solid white;
        border-radius: 50%;
        bottom: -1px;
        right: -2px;
      }
      .stepcount {
        font-size: 12px;
        color: #697d8f;
        white-space: nowrap;
      }
      .coach h2 {
        font-size: 25px;
        line-height: 1.2;
        letter-spacing: -0.035em;
      }
      .coach .instruction {
        margin-top: 15px;
        font-size: 17px;
        line-height: 1.7;
        color: #4a6074;
      }
      .coach .primary {
        width: 100%;
        margin-top: 25px;
      }
      .coach .choices {
        display: grid;
        gap: 10px;
        margin-top: 23px;
      }
      .choice {
        width: 100%;
        padding: 14px 15px;
        border: 1.5px solid #dce5ee;
        border-radius: 13px;
        color: var(--ink);
        background: white;
        display: flex;
        gap: 11px;
        align-items: center;
        text-align: left;
        line-height: 1.4;
        font-size: 16px;
        font-weight: 650;
        min-height: 60px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .choice:hover {
        background: #f2f7fc;
        border-color: #8cb5da;
      }
      .choice .letter {
        background: #eff4f8;
        color: #587086;
        border-radius: 7px;
        flex-shrink: 0;
        width: 27px;
        height: 27px;
        text-align: center;
        font-size: 12px;
        line-height: 27px;
      }
      .choice.correct {
        border-color: #6ead94;
        background: #eef8f3;
      }
      .choice.incorrect {
        border-color: #d4a27c;
        background: #fff7ee;
      }
      .feedback {
        border-radius: 14px;
        padding: 17px 18px;
        margin-top: 20px;
        background: #fff6e7;
        border: 1px solid #efd4a5;
        color: #795019;
        font-size: 16px;
        line-height: 1.6;
      }
      .feedback.good {
        color: #255e4c;
        background: #edf8f2;
        border-color: #bcdfcf;
      }
      .feedback strong {
        display: block;
        margin-bottom: 4px;
        color: inherit;
      }
      .hint-box {
        margin-top: 16px;
        padding: 15px;
        border-left: 3px solid #cf9a31;
        background: #fcf6e9;
        color: #675738;
        font-size: 15px;
      }
      .help-row {
        border-top: 1px solid #e8edf1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 25px;
        padding-top: 13px;
      }
      .help-row button {
        background: none;
        color: #547086;
        font-size: 13px;
        font-weight: 700;
        padding: 8px 0;
      }
      .help-row button:hover {
        text-decoration: underline;
      }
      .progress-dots {
        display: flex;
        gap: 5px;
        margin-top: 21px;
      }
      .progress-dots span {
        height: 4px;
        border-radius: 3px;
        flex: 1;
        background: #e7edf2;
      }
      .progress-dots span.done {
        background: #467f70;
      }
      .progress-dots span.current {
        background: #deb257;
      }
      .source-fold {
        margin-top: 25px;
        color: var(--muted);
        font-size: 14px;
        border-top: 1px solid var(--line);
        padding: 17px 2px;
      }
      .source-fold summary {
        cursor: pointer;
        width: fit-content;
        font-weight: 650;
      }
      .source-fold p {
        max-width: 900px;
        margin-top: 12px;
      }
      .source-fold a {
        font-size: 14px;
      }
      .compare {
        display: flex;
        padding: 4px;
        background: #edf2f6;
        border-radius: 10px;
        gap: 4px;
        margin: 18px 0 0;
      }
      .compare button {
        flex: 1;
        background: transparent;
        border-radius: 7px;
        padding: 7px 10px;
        font-size: 13px;
        color: #476075;
        font-weight: 750;
      }
      .compare button.selected {
        background: white;
        color: #1c5f98;
        box-shadow: 0 2px 5px #263b4c10;
      }
      .control-box {
        margin-top: 20px;
        border: 1px solid #dce6ef;
        border-radius: 13px;
        padding: 17px;
        background: #f6f9fc;
      }
      .control-box label {
        font-size: 14px;
        font-weight: 700;
        display: block;
      }
      .control-value {
        font-size: 28px;
        font-weight: 750;
        letter-spacing: -0.03em;
        color: #185b98;
        margin: 8px 0;
      }
      .unit {
        font-size: 14px;
        letter-spacing: 0;
        color: #5d7285;
      }
      .range-labels {
        display: flex;
        justify-content: space-between;
        color: #63778a;
        font-size: 12px;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #206aab;
        min-height: 30px;
        cursor: pointer;
      }
      input[type="number"],
      input[type="search"],
      input[type="text"] {
        padding: 12px 14px;
        background: white;
        border: 1px solid #b7c9d8;
        border-radius: 10px;
        max-width: 100%;
        color: var(--ink);
        width: 100%;
      }
      .range-number {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .range-number input {
        max-width: 140px;
      }
      .result-line {
        font-size: 15px;
        color: var(--muted);
        margin-top: 10px;
      }
      .result-line strong {
        color: var(--ink);
      }
      .equation {
        font-size: 16px;
        line-height: 1.8;
        padding: 14px;
        background: #f3f6f9;
        border-radius: 10px;
        margin-top: 15px;
      }
      .map-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 19px;
      }
      .mission-card {
        background: white;
        border-radius: 19px;
        overflow: hidden;
        border: 1px solid var(--line);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .mission-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow);
      }
      .card-visual {
        height: 165px;
        overflow: hidden;
        position: relative;
        background: #e8eff5;
      }
      .card-visual svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .card-label {
        position: absolute;
        left: 16px;
        top: 14px;
        color: #385269;
        font-size: 11px;
        font-weight: 800;
        background: #ffffffe8;
        padding: 4px 9px;
        border-radius: 7px;
      }
      .card-info {
        padding: 22px;
      }
      .card-info h3 {
        font-size: 20px;
        letter-spacing: -0.03em;
      }
      .card-info p {
        color: var(--muted);
        font-size: 14px;
        margin-top: 10px;
        min-height: 44px;
      }
      .card-info .button-row {
        margin-top: 18px;
        justify-content: space-between;
      }
      .card-info button {
        font-size: 14px;

      function guideContent() {
        if (guideTab === "processes")
          return `<div class="guide-grid"><section class="guide-card wide"><h2>Start with the requirements</h2><p>Decide what the part must do, what shape and material it needs, how many are required, and how quality will be checked. Compare costs only among routes that can meet those needs.</p><p><strong>Conversion</strong> means turning raw material into a useful product. <strong>Near net shape</strong> means producing something close to the final size and shape, with little finishing.</p></section>${processes.map((p) => `<section class="guide-card"><div class="eyebrow">${p[2]}</div><h2 style="margin-top:8px">${p[1]}</h2><p>${p[3]}</p>${btn("demo", "Watch the diagram", p[0], "subtle")}</section>`).join("")}<section class="guide-card wide"><h2>Material families</h2><div class="wrap-table"><table><thead><tr><th>Family</th><th>What happens on reheating?</th><th>Examples</th></tr></thead><tbody><tr><td>Thermoplastic</td><td>Can soften or melt again under suitable processing conditions.</td><td>Polyethylene, polypropylene, polystyrene, PVC, acrylic, nylon; PET is a thermoplastic polyester.</td></tr><tr><td>Cured thermoset</td><td>Does not remelt into a shapeable liquid. Excessive heat can damage it.</td><td>Cured epoxy, phenolic (Bakelite), melamine resin, thermoset polyester.</td></tr></tbody></table></div><p class="note" style="margin-top:12px">Polyester and polyurethane are broad families: their names alone do not determine thermoplastic or thermoset behavior. Thermoplastics are not automatically accepted in every recycling system; cured thermosets are not recycled by ordinary remelting, though other recovery routes exist.</p></section><section class="guide-card"><h2>Designing with plastics</h2><p>Plastics can offer low weight, insulation, color, and economical shaping. Their performance depends on the formulation, reinforcement, geometry, temperature, and loading.</p><p>Ribs, gussets, and molded-in inserts can help a design. Simply making walls thicker is not always a good solution: uneven thickness can complicate molding and cooling.</p></section><section class="guide-card"><h2>Two related blow processes</h2><p><strong>Extrusion blow molding:</strong> form a hot tube called a parison, close the mold, inflate, cool, and remove.</p><p><strong>Injection blow molding:</strong> injection-mold a preform, transfer it to a blow mold, inflate, cool, and remove. Stretch blow molding also stretches the preform.</p><p><strong>Reaction injection molding:</strong> reactive liquid components enter the mold and react; it differs from the thermoplastic pellet cycle used in Mission 2.</p></section><section class="guide-card wide"><h2>Pressure, speed, and tooling: useful trends</h2><p>Injection molding generally uses high pressure and sophisticated tooling. Blow molding inflates a hollow part. Rotational molding operates near ambient pressure with relatively slow cycles and often simpler, lower-cost tooling. Thermoforming shapes sheets; extrusion produces continuous profiles.</p><p class="note">The slides include illustrative operating ranges and historical equipment prices. They vary by process and part, and are not current quotes or universal operating limits. Compression molding is not automatically the strongest process; durability depends on material, reinforcement, geometry, and processing.</p></section></div>`;
        if (guideTab === "casting")
          return `<div class="guide-grid"><section class="guide-card wide"><h2>The casting workflow</h2><p>Prepare the mold → melt → pour → solidify → remove → finish → inspect.</p><p>Preparation and melting may overlap. A foundry is a facility that makes castings. Real work involves high temperatures, specialized equipment, environmental controls, and trained operators. This game teaches concepts, not operating procedures.</p></section><section class="guide-card wide"><h2>Three mold-and-pattern families</h2><div class="wrap-table"><table><thead><tr><th>Family</th><th>Processes in the course</th><th>Remember</th></tr></thead><tbody><tr><td>Single-use mold, reusable pattern</td><td>Sand, shell, plaster, reusable-pattern ceramic mold</td><td>The pattern makes another mold. The individual mold is destroyed to release the part.</td></tr><tr><td>Single-use mold, single-use pattern</td><td>Investment (lost wax), lost foam</td><td>Both pattern and mold are consumed. A die used to make wax patterns can be reused.</td></tr><tr><td>Reusable mold</td><td>Permanent mold, high-pressure die casting</td><td>The tool opens for removal and is used again. No separate cavity-forming pattern is consumed each cycle.</td></tr></tbody></table></div></section><section class="guide-card"><h2>Single-use mold details</h2><p><strong>Sand:</strong> a pattern shapes foundry sand. Patterns may be wood, metal, or plastic, single-piece or split. A match plate aligns pattern halves.</p><p><strong>Shell:</strong> resin-bonded sand forms a thin shell on a heated pattern; the supported shell is the mold.</p><p><strong>Plaster:</strong> slurry sets around a pattern, then the mold is prepared and dried; useful for suitable lower-temperature alloys.</p><p><strong>Ceramic:</strong> refractory mold material can tolerate higher temperatures. Here, distinguish reusable-pattern ceramic molding from lost-wax investment casting.</p></section><section class="guide-card"><h2>Reusable mold details</h2><p><strong>Permanent mold:</strong> a reusable metal mold fills by gravity or with pressure/vacuum assistance. Tooling investment and tool life matter.</p><p><strong>High-pressure die casting:</strong> pressure forces metal into a reusable die. It can make detailed parts at volume, commonly from nonferrous alloys. Gas porosity remains a process concern.</p><p><strong>Trade-off:</strong> higher tooling cost can lower recurring part cost when volume and design justify it.</p></section><section class="guide-card wide"><h2>Read the failure mechanism</h2><div class="wrap-table"><table><thead><tr><th>Problem</th><th>Meaning</th><th>What to investigate</th></tr></thead><tbody><tr><td>Gas porosity</td><td>Gas forms or becomes trapped, leaving pores.</td><td>Gas sources, melt treatment, turbulence, and venting.</td></tr><tr><td>Shrinkage cavity</td><td>Liquid metal does not adequately feed a region as it solidifies.</td><td>Riser and feeding design, geometry, and solidification.</td></tr><tr><td>Misrun</td><td>The cavity is not completely filled.</td><td>Fluidity, temperature, filling time, and gating.</td></tr><tr><td>Cold shut</td><td>Metal fronts meet without properly fusing.</td><td>Filling and thermal conditions. This is distinct from an unfilled cavity.</td></tr><tr><td>Metal penetration</td><td>Metal enters spaces between mold grains, worsening the surface.</td><td>Sand/mold condition, pressure, and temperature.</td></tr><tr><td>Sand inclusion</td><td>Loose or eroded sand becomes embedded in the casting.</td><td>Mold/core integrity, erosion, and flow. It is not identical to penetration.</td></tr><tr><td>Cracking / hot tears</td><td>Stress and constrained contraction can damage the casting.</td><td>Geometry, restraint, alloy, and thermal conditions.</td></tr></tbody></table></div></section><section class="guide-card"><h2>Quality is more than appearance</h2><p><strong>Dimensions:</strong> appropriate calibrated measurement.</p><p><strong>Surface openings:</strong> suitable dye penetrant inspection.</p><p><strong>Internal soundness:</strong> a qualified radiographic or ultrasonic method, as appropriate.</p><p><strong>Mechanical properties:</strong> hardness, tensile, impact, or other specified testing.</p><p><strong>Chemistry:</strong> suitable composition analysis. An X-ray image for internal flaws is not the same as an X-ray-based composition method.</p></section><section class="guide-card"><h2>Other casting names in the overview</h2><p>The slides also name continuous casting, centrifugal casting, gravity die casting, vacuum casting, low-pressure casting, and squeeze die casting.</p><p>Some labels overlap with broader families: gravity die casting is a permanent-mold route; pressure/vacuum describe filling assistance. Continuous casting forms an ongoing strand; centrifugal casting uses rotation. Squeeze casting applies pressure during solidification.</p><p class="note">These are brief orientation notes. The supplied slides do not develop complete lessons for every named process.</p></section></div>`;

          const c = l.practice[p.tryStep];
          if (c.type === "choice")
            return `<div class="eyebrow">${c.setting ? "Change one setting" : "Try one small decision"} · ${p.tryStep + 1} of ${l.practice.length}</div><h2 id="coachTitle" tabindex="-1">${esc(c.title)}</h2><p class="instruction">${esc(c.text)}</p><div class="operation-cue compact"><span class="cue-number">1</span><p>${c.setting ? "Choose the change you want to try." : "Choose the card that fits the clue."}</p></div><div class="choices">${c.choices.map((label, i) => `<button type="button" class="choice ${p.selected === i ? "selected" : ""} ${p.hints === 3 && i === c.answer ? "guided-target" : ""}" data-action="choose" data-value="${i}" aria-pressed="${p.selected === i}"><span class="letter" aria-hidden="true">${String.fromCharCode(65 + i)}</span><span>${esc(label)}</span><span class="selection-mark" aria-hidden="true">${p.selected === i ? "✓" : ""}</span></button>`).join("")}</div>${p.selected !== null ? `<div class="operation-cue compact"><span class="cue-number">2</span><p>Now test your idea and watch what happens.</p></div>${btn("runChoice", icon("play", 18) + " " + esc(c.runLabel || "Run my experiment"), "", "primary action-target")}` : '<p class="note" style="margin-top:15px">Choose one card. Your Run button will appear here.</p>'}${feedbackHTML()}`;
        }
        let html = originalCoachHTML();
        if (p.phase === "try" && p.solved) {
          html = html
            .replace("You made a useful discovery", "Experiment complete")
            .replace("Here’s why it works.", "What changed—and why?");
          if (["choice", "pattern"].includes(l.practice[p.tryStep].type))
            html += btn(
              "replayExperiment",
              "↻ Replay this experiment",
              "",
              "quiet",
            );
        }
        return html;
      };
      // Frame-based animation: only one is active. Navigation cancels it without awarding progress.
      function startAnimation(
        info,
        from,
        onDone,
        {
          look = "Follow the moving material.",
          duration = 4200,
          target = "lesson",
        } = {},
      ) {
        cancelAnimation();
        const id = ++animationId;
        animation = {
          id,
          info,
          from,
          onDone,
          look,
          duration,
          target,
          f: 0,
          elapsed: 0,
          last: null,
          paused: false,
        };
        render();
        drawAnimation(0);
        $("#coachTitle")?.focus({ preventScroll: true });
        if (innerWidth < 761)
          $("#simScene")?.scrollIntoView({
            behavior: "instant",
            block: "start",
          });
        if (!state.settings.motion) {
          finishAnimation();
          return;
        }
        queueAnimationFrame();
      }
      function drawAnimation(f) {
        if (!animation) return;
        const { info, from } = animation;
        const dest =
          animation.target === "modal" ? $("#demoScene") : $("#simScene");
        if (dest)
          dest.innerHTML = scene(info.kind, { ...info.opt, from, frame: f });
        const fill = $("#cycleFill");
        if (fill) fill.style.width = f * 100 + "%";
      }
      function queueAnimationFrame() {
        const id = animation?.id;
        if (id !== undefined)
          requestAnimationFrame((now) => {
            if (animation?.id === id) animationTick(now);
          });
      }
      function animationTick(now) {
        const a = animation;
        if (!a || a.paused) return;
        if (a.last === null) a.last = now;
        const dt = Math.min(100, Math.max(0, now - a.last));
        a.last = now;
        a.elapsed += dt;
        a.f = clamp01(a.elapsed / a.duration);
        if (!a.lastPaint || now - a.lastPaint >= 40 || a.f === 1) {
          drawAnimation(a.f);
          a.lastPaint = now;
        }
        if (a.f >= 1) {
          finishAnimation();
          return;
        }
        queueAnimationFrame();
      }
      function finishAnimation() {
        if (!animation) return;
        const a = animation;
        drawAnimation(1);
        animation = null;
        animationId++;
        lastScene = a.info;
        a.onDone();
        save();
        render();
        $("#result")?.focus({ preventScroll: true });
        if (innerWidth < 761)
          $("#coach")?.scrollIntoView({ behavior: "instant", block: "start" });
        announce(
          "Experiment complete. " +
            (view === "orientation"
              ? orientationCards()[orientationStep].notice
              : progress().phase === "watch"
                ? lessons[state.current].watch[progress().step].notice
                : feedback ||
                  lessons[state.current].practice[progress().tryStep]?.why ||
                  "Read the result."),
        );
      }
      function cancelAnimation() {
        animation = null;
        animationId++;
      }
      wrong = function (...args) {
        trialScene = null;
        originalWrong(...args);
      };
      navigate = function (target) {
        cancelAnimation();
        trialScene = null;
        guideLevel = 0;
        originalNavigate(target);
      };
      openLesson = function (i) {
        cancelAnimation();
        originalOpenLesson(i);
      };
      advance = function () {
        trialScene = null;
        progress().selected = null;
        progress().hints = 0;
        originalAdvance();
      };
      function demoCurrent() {
        const p = progress(),
          w = lessons[state.current].watch[p.step];
        startAnimation(
          { kind: w.kind, opt: w.opt, title: w.action, caption: w.look },
          w.from,
          () => {
            if (!p.demoDone.includes(p.step)) p.demoDone.push(p.step);
          },
          { look: w.look },
        );
      }
      function choiceAnimation(replay = false) {
        const p = progress(),
          c = lessons[state.current].practice[p.tryStep];
        const correct = replay || p.selected === c.answer;
        let kind = c.kind,
          opt = correct ? afterState(c) : initialState(c);
        let from = initialState(c);
        if (state.current === 0 && p.tryStep < 2) opt = afterState(c);
        if (kind === "inspection") {
          const selected =
            state.current === 8
              ? inspectNames.indexOf(c.choices[p.selected])
              : state.current === 10 && p.tryStep === 4
                ? correct
                  ? 1
                  : 2
                : -1;
          if (selected >= 0) {
            opt = { ...opt, mode: selected, step: 1 };
            from = { ...from, mode: selected, step: 0 };
          }
        }
        if (
          [
            "injection",
            "blow",
            "extrusion",
            "thermo",
            "compression",
            "rotational",
          ].includes(kind)
        ) {
          opt.cycle = true;
          if (
            kind === "injection" &&
            !correct &&
            state.current === 1 &&
            p.tryStep === 0
          )
            opt.bad = true;
        }
        if (kind === "rescue" && !correct && p.tryStep === 1) opt.fix = "vent";
        if (state.current === 2 && !correct) {
          const proc = processes.find((x) => x[1] === c.choices[p.selected]);
          if (proc) {
            kind = proc[0];
            from = { step: 0 };
            opt = { step: 4, cycle: true };
          }
        }
        startAnimation(
          {
            kind,
            opt,
            title: correct ? "Try the process" : "Test your idea",
            caption: c.text,
          },
          from,
          () => {
            if (correct) {
              if (!replay) originalSolve();
              else render();
            } else {
              p.wrong++;
              trialScene = {
                kind,
                opt: { ...opt, from, frame: 1 },
                title: "Your trial result",
                caption: c.hint || lessons[state.current].say,
              };
              feedback =
                state.current === 0 && p.tryStep < 2
                  ? "Compare your prediction with the result. " + c.why
                  : state.current === 10 && p.tryStep === 4
                    ? "An appropriate internal method can investigate a sealed flaw. This question asks which method cannot reach that flaw."
                    : kind === "inspection"
                      ? "You tried " +
                        inspectNames[opt.mode] +
                        ". " +
                        (c.hint || lessons[state.current].say)
                      : "That choice does not address this clue. " +
                        (c.hint || lessons[state.current].say);
              p.selected = null;
              save();
            }
          },
          {
            look:
              kind === "rescue"
                ? "Watch the next pour: gas control and feeding act before the part is fully solid."
                : kind === "inspection"
                  ? "Watch what this method can reveal."
                  : "Watch what your selected action makes.",
            duration: kind === "injection" ? 5400 : 4200,
          },
        );
      }
      function pointToNext() {
        const p = progress();
        p.hints = 3;
        save();
        render();
        let el;
        if (
          p.phase === "try" &&
          !p.solved &&
          lessons[state.current].practice[p.tryStep].type === "choice"
        )
          el = $(
            `.choice[data-value="${lessons[state.current].practice[p.tryStep].answer}"]`,
          );
        else if (p.phase === "explain" && !p.answered)
          el = $(
            `.choice[data-value="${missions[state.current].questions[p.q][2]}"]`,
          );
        else el = $("#coach .primary");
        el?.classList.add("guided-target");
        el?.focus({ preventScroll: true });
        el?.scrollIntoView({ behavior: "instant", block: "center" });
        announce(stepHelp());
      }
      function observationForWrong() {
        return feedback;
      }
      document.addEventListener(
        "click",
        (e) => {
          const b = e.target.closest("[data-action]");
          if (!b || b.disabled) return;
          const a = b.dataset.action,
            v = b.dataset.value,
            p = progress();
          const controlled = [
            "testPattern",
            "lessonHelp",
            "help",
            "guidedStart",
            "orientation",
            "orientationRun",
            "orientationNext",
            "orientationAnswer",
            "runDemo",
            "runChoice",
            "replayExperiment",
            "choose",
            "hint",
            "point",
            "pauseCycle",
            "finishCycle",
            "watchNext",
            "watchBack",
            "motion",
            "enlarge",
            "confirmReset",
          ];
          if (!controlled.includes(a)) {
            if (
              [
                "view",
                "lesson",
                "begin",
                "restartWatch",
                "replay",
                "guideTab",
                "reset",
              ].includes(a)
            )
              cancelAnimation();
            return;
          }
          e.preventDefault();
          e.stopImmediatePropagation();
          if (
            animation &&
            !["pauseCycle", "finishCycle", "motion", "enlarge"].includes(a)
          )
            return;
          switch (a) {
            case "testPattern": {
              const raw = $("#patternNumber")?.value,
                n = Number(raw);
              if (!raw || !Number.isFinite(n) || n < 100 || n > 104) {
                wrong("Enter a pattern length from 100 to 104 mm.");
                break;
              }
              if (Math.abs(p.pattern * 0.98 - 100) > 0.1) {
                wrong(
                  `The cooled part is ${(p.pattern * 0.98).toFixed(2)} mm. Aim for 99.90–100.10 mm. Try 102.04 mm, then check again.`,
                );
                break;
              }
              startAnimation(
                {
                  kind: "fit",
                  opt: { pattern: p.pattern },
                  title: "Test your pattern allowance",
                  caption: "Watch the cooled length approach the target.",
                },
                { pattern: p.pattern },
                () => originalSolve(),
                { look: "Watch the cooled length and the target line." },
              );
              break;
            }
            case "lessonHelp":
            case "help":
              modal(
                `<div class="eyebrow">You can take your time</div><h2>Follow one button at a time.</h2><p><strong>1. Make it with me.</strong> Press the named blue button and watch the material move. Read “What just happened,” then continue.</p><p><strong>2. Try a small challenge.</strong> Choose a card or change a setting. Press Run to test your idea. Use the result to try again if needed.</p><p><strong>3. Remember the idea.</strong> Answer two short questions about why the process worked. Hints are always available.</p><p><strong>If you feel lost:</strong> press “Show me what to click.” The next useful control will be highlighted.</p><p class="note">Milo uses prepared guidance included in this file. It is not a live AI chatbot. There is no timer, penalty, or account.</p>`,
              );
              break;
            case "guidedStart":
              if (state.oriented) openLesson(state.current);
              else {
                orientationStep = 0;
                orientationDone = false;
                orientationWrong = "";
                navigate("orientation");
              }
              break;
            case "orientation":
              orientationStep = 0;
              orientationDone = false;
              orientationWrong = "";
              navigate("orientation");
              break;
            case "orientationRun": {
              const c = orientationCards()[orientationStep];
              startAnimation(
                { kind: c.kind, opt: c.to, title: c.action, caption: c.look },
                c.from,
                () => {
                  orientationDone = true;
                },
                { look: c.look },
              );
              break;
            }
            case "orientationNext":
              if (!orientationDone) break;
              if (orientationStep < 2) {
                orientationStep++;
                orientationDone = false;
                orientationWrong = "";
                render();
                lessonFocus();
              } else {
                state.oriented = true;
                save();
                openLesson(0);
              }
              break;
            case "orientationAnswer":
              if (Number(v) === 0) {
                orientationDone = true;
                orientationWrong = "";
                render();
                $("#result")?.focus({ preventScroll: true });
              } else {
                orientationWrong =
                  "Remember the first movement: heat softened the strip. Cooling made the new shape firm. Try A.";
                render();
                announce(orientationWrong);
              }
              break;
            case "runDemo":
              demoCurrent();
              break;
            case "watchNext":
              if (p.phase !== "watch" || !p.demoDone.includes(p.step)) break;
              if (p.step < lessons[state.current].watch.length - 1) p.step++;
              else {
                p.phase = "try";
                p.tryStep = 0;
                p.solved = false;
                if (state.current === 9) {
                  p.sawLow = true;
                  p.qty = 100;
                }
              }
              advance();
              break;
            case "watchBack":
              if (p.phase === "watch" && p.step > 0) {
                p.step--;
                advance();
              }
              break;
            case "choose":
              if (p.phase === "try" && !p.solved) {
                p.selected = Number(v);
                feedback = "";
                save();
                render();
                $("[data-action=runChoice]")?.focus({ preventScroll: true });
                announce(
                  "Selected. Now press the Run button to test your idea.",
                );
              }
              break;
            case "runChoice":
              if (p.phase === "try" && !p.solved && p.selected !== null)
                choiceAnimation();
              break;
            case "replayExperiment":
              if (p.phase === "try" && p.solved) choiceAnimation(true);
              break;
            case "hint":
              p.hints = Math.min(3, p.hints + 1);
              save();
              render();
              $("[data-action=hint]")?.focus({ preventScroll: true });
              announce(stepHelp());
              break;
            case "point":
              pointToNext();
              break;
            case "pauseCycle":
              if (!animation) break;
              animation.paused = !animation.paused;
              animation.id = ++animationId;
              animation.last = null;
              render();
              drawAnimation(animation.f);
              $("[data-action=pauseCycle]")?.focus({ preventScroll: true });
              if (!animation.paused) queueAnimationFrame();
              break;
            case "finishCycle":
              finishAnimation();
              break;
            case "motion":
              state.settings.motion = !state.settings.motion;
              save();
              if (animation && !state.settings.motion) finishAnimation();
              else render();
              break;
            case "enlarge": {
              if (animation) {
                animation.paused = true;
                animation.id = ++animationId;
                animation.last = null;
                render();
                drawAnimation(animation.f);
                const a = animation;
                modal(
                  `<div class="eyebrow">Paused · look closely</div><h2>${esc(a.info.title)}</h2><div class="diagram-scroll">${scene(a.info.kind, { ...a.info.opt, from: a.from, frame: a.f })}</div><p>${esc(a.look)}</p><p class="note">Close this view, then press Resume movement when you are ready.</p>`,
                );
                returnFocus = $("[data-action=pauseCycle]");
                $("#dialog").classList.add("diagram-modal");
                break;
              }
              const info =
                view === "orientation"
                  ? (() => {
                      const c = orientationCards()[orientationStep];
                      return {
                        kind: c.kind,
                        opt: orientationDone
                          ? { ...c.to, from: c.from, frame: 1 }
                          : c.from,
                        title: c.title,
                        caption: c.look,
                      };
                    })()
                  : stageInfo();
              modal(
                `<div class="eyebrow">Look closer</div><h2>${esc(info.title)}</h2><div class="diagram-scroll">${scene(info.kind, info.opt)}</div><p>${esc(info.caption)}</p><p class="note" style="margin-top:12px">On a small screen, scroll sideways to see the whole diagram.</p>`,
              );
              $("#dialog").classList.add("diagram-modal");
              break;
            }
            case "confirmReset":
              cancelAnimation();
              state = defaults();
              state.handsonEdition = 3;
              state.oriented = false;
              orientationStep = 0;
              orientationDone = false;
              try {
                localStorage.removeItem("maker-academy-isen246-v1");
              } catch (err) {}
              save();
              $("#dialog").close();
              navigate("home");
              break;
          }
        },
        true,
      );
      // Keep the help available in the same location in every lesson.
      const oldHelp = showDemo;
      completeHTML = function () {
        return originalCompleteHTML()
          .replace(
            "Badge earned · 100 practice XP",
            "You made it · 100 practice XP",
          )
          .replace(
            "Use the words in your own explanation. A badge records practice, not a course grade.",
            "Tell someone the idea in your own words. That is the learning you take back to class.",
          );
      };
      const priorReport = reportText;
      reportText = function () {
        return (
          priorReport() +
          `\nGUIDED PRACTICE EDITION\nBeginner walkthrough completed: ${state.oriented ? "Yes" : "Not yet"}\n` +
          lessons
            .map(
              (l, i) =>
                `${i + 1}. Animated demonstration steps completed: ${(state.lessons[i]?.demoDone || []).length}/${l.watch.length}`,
            )
            .join("\n") +
          "\n"
        );
      };
      render();
    </script>
  </body>
</html>
